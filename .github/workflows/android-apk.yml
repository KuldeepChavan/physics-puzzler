name: Android APK

# Builds a downloadable prismfall.apk in the cloud — nothing needed locally.
# Artifacts on every push to main; attaches the APK to a Release when you push a v* tag.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Capacitor CLI 8 requires Node >= 22
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Capacitor 8 targets SDK 36 and requires JDK 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # GitHub's ubuntu runner ships a fully licensed Android SDK.
      # (android-actions/setup-android@v3 is avoided: it tries to install the
      # long-removed "tools" package and fails.)
      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using SDK at $SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null || true

      - run: npm install
      - run: npm run build

      # The android/ project is generated from capacitor.config.ts, not committed
      - run: npx cap add android
      - run: npx cap sync android

      - name: Point Gradle at the SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build APK (debug-signed, sideloadable)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - run: cp android/app/build/outputs/apk/debug/app-debug.apk prismfall.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: prismfall-apk
          path: prismfall.apk
          if-no-files-found: error

      - name: Attach APK to tag release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: prismfall.apk
